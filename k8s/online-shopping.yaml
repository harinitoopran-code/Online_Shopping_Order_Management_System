apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shopping
spec:
  replicas: 1
  selector:
    matchLabels: {app: online-shopping}
  template:
    metadata:
      labels: {app: online-shopping}
    spec:
      containers:
      - name: web
        image: online-shopping:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: online-shopping-service
spec:
  type: NodePort
  selector: {app: online-shopping}
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082
